name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.0.21"
        required: true
        default: "2.1.17"
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build macOS package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -m pip install --upgrade pip
          bash scripts/build_macos_release.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaForge-${{ steps.version.outputs.version }}-macos
          path: |
            releases/LumaForge-${{ steps.version.outputs.version }}-macos.zip
            releases/LumaForge-${{ steps.version.outputs.version }}-macos.sha256.txt

      - name: Upload to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/LumaForge-${{ steps.version.outputs.version }}-macos.zip
            releases/LumaForge-${{ steps.version.outputs.version }}-macos.sha256.txt
